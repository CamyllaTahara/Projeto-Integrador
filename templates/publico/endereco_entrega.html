<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Endereço de Entrega</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/publico/endereco_entrega.css') }}">
</head>
<body>

    <div class="container-endereco">
        <h1>Informe ou selecione seu endereço para entrega</h1>

        <form action="{{ url_for('publico.endereco_entrega') }}" method="POST">

            {% if enderecos_salvos %}
                <h3>Escolha um dos seus endereços salvos:</h3>

                <div class="lista-enderecos">
                    {% for end in enderecos_salvos %}
                        <div class="opcao-card">
                            <input
                                type="radio"
                                id="end_{{ end.id_endereco_cliente }}"
                                name="id_endereco_existente"
                                value="{{ end.id_endereco_cliente }}"
                            >
                            <label for="end_{{ end.id_endereco_cliente }}">
                                <strong>{{ end.rua }}, {{ end.numero }}</strong>
                                - {{ end.bairro }}
                                {% if end.complemento %}
                                    ({{ end.complemento }})
                                {% endif %}
                                - CEP: {{ end.cep }}
                            </label>
                        </div>
                    {% endfor %}
                </div>

                <button
                    type="submit"
                    name="acao"
                    value="usar_existente"
                    class="btn-acao secundario"
                >
                    Usar endereço selecionado
                </button>

                <hr class="divisor">
            {% endif %}

            <h3>Ou cadastre um novo endereço:</h3>

            <div class="campo-grupo">
                <label>CEP:</label>
                <input type="text" id="cep" name="cep" maxlength="8" placeholder="Apenas números" class="form-control">
            </div>

            <div class="campo-grupo">
                <label>Rua:</label>
                <input type="text" id="rua" name="rua" class="form-control">
            </div>

            <div class="campo-grupo">
                <label>Número:</label>
                <input type="text" id="numero" name="numero" class="form-control">
            </div>

            <div class="campo-grupo">
                <label>Bairro:</label>
                <input type="text" id="bairro" name="bairro" class="form-control">
            </div>

            <div class="campo-grupo">
                <label>Cidade:</label>
                <input type="text" id="cidade" name="cidade" class="form-control">
            </div>

            <div class="campo-grupo">
                <label>Estado:</label>
                <input type="text" id="estado" name="estado" class="form-control">
            </div>

            <div class="campo-grupo">
                <label>Complemento (opcional):</label>
                <input type="text" name="complemento" class="form-control">
            </div>

            <div class="campo-grupo">
                <label>Referência (opcional):</label>
                <input type="text" name="referencia" class="form-control">
            </div>

            <button
                type="submit"
                name="acao"
                value="cadastrar_novo"
                class="btn-acao principal"
            >
                Salvar novo endereço e continuar
            </button>

        </form>
    </div>

    <script src="{{ url_for('static', filename='js/viacep.js') }}"></script>

</body>
</html>
