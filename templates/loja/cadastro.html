<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro da Loja</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/loja/cadastro_loja.css') }}">
</head>
<body>

    <div class="container-cadastro">
        <h1>Cadastro da Loja</h1>
        
        <form action="/loja/cadastro" method="POST" enctype="multipart/form-data">

            <div class="campo-grupo">
                <label for="nome_responsavel">Nome Completo do Responsável:</label>
                <input type="text" id="nome_responsavel" name="nome_responsavel" class="form-control" required>
            </div>

            <div class="campo-grupo">
                <label for="nome_loja">Nome da Loja:</label>
                <input type="text" id="nome_loja" name="nome_loja" class="form-control" required>
            </div>

            <div class="campo-grupo">
                <label for="cnpj">CNPJ:</label>
                <input type="text" id="cnpj" name="cnpj" class="form-control" placeholder="00.000.000/0001-00" maxlength="18" required>
            </div>

            <div class="campo-grupo">
                <label for="whatsapp">WhatsApp:</label>
                <input type="text" id="whatsapp" name="whatsapp" class="form-control" placeholder="(00) 00000-0000" maxlength="15" required>
            </div>

            <div class="campo-grupo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>

            <div class="campo-grupo">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" class="form-control" required>
            </div>

            <div class="campo-grupo">
                <label>Logo da Loja:</label>
                <div class="input-arquivo-wrapper">
                    <input type="file" id="logo" name="logo" class="input-file-oculto" onchange="atualizarNomeArquivo(this)">
                    <label for="logo" class="btn-escolher-arquivo">📁 Escolher Arquivo</label>
                    <span id="nome-arquivo" class="texto-arquivo-escolhido">Nenhum arquivo escolhido</span>
                </div>
            </div>
            
            <button type="submit" class="btn-acao">Cadastrar Loja</button>

        </form>

        <div class="rodape-link">
            <small>Já tem uma conta? <a href="{{ url_for('loja.login_loja') }}">Entrar</a></small>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/mascaras.js') }}"></script>

<script src="{{ url_for('static', filename='js/cadastro_loja.js') }}"></script>
</body>
</html>
